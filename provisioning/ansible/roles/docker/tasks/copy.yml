---
- name: Create application directory
  ansible.builtin.file:
    path: /opt/{{ app_name }}
    state: directory
    mode: "0755"
  tags: always

- name: Synchronize configuration files
  ansible.posix.synchronize:
    src: "files/{{ group_names[0] }}/"
    dest: "/opt/{{ app_name }}/config_files/"
    delete: yes
    recursive: yes
    rsync_opts:
      - "--chmod=D0755,F0644"

- name: Deploy templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/opt/{{ app_name }}/{{ item.path | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  with_community.general.filetree: "templates/{{ group_names[0] }}/"
  when: item.state == "file"
  vars:
    IMAGE_TAG: "latest"