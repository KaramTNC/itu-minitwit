---
- name: Create application directory
  ansible.builtin.file:
    path: /opt/{{ app_name }}
    state: directory
    mode: "0755"
  tags: always

- name: Create configuration directory
  ansible.builtin.file:
    path: /opt/{{ app_name }}/config
    state: directory
    mode: "0755"
  tags: always

- ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ group_names[0] }}/config"
  register: config_dir_stat
  delegate_to: localhost
  become: false

- name: Synchronize configuration files
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/{{ group_names[0] }}/config/"
    dest: "/opt/{{ app_name }}/config/"
    delete: yes
    recursive: yes
    rsync_opts:
      - "--chmod=D0755,F0644"
  when: config_dir_stat.stat.exists
  delegate_to: localhost
  become: false

- name: Deploy templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/opt/{{ app_name }}/{{ item.path | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  with_community.general.filetree: "templates/{{ group_names[0] }}/"
  when: item.state == "file"
  vars:
    IMAGE_TAG: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"