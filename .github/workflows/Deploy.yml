name: Deploy Production

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        required: true
        type: string
      environment:
        required: true
        type: string
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  docker-build-publish:
    uses: ./.github/workflows/DockerBuildPublish.yml
    with:
      image_tag: ${{ inputs.image_tag || 'latest' }}
    secrets: inherit
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build-publish]
    env:
      DB_URL: ${{ secrets.DB_URL }}
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3.4.2
        with:
          dotnet-version: 8.0.x

      - name: Cache migration bundle
        id: cache-efbundle
        uses: actions/cache@v4
        with:
          path: provisioning/ansible/roles/migrations/files/efbundle
          key: efbundle-${{ hashFiles('src/Infrastructure/Migrations/**') }}

      - name: Build database migration bundle
        if: steps.cache-efbundle.outputs.cache-hit != 'true'
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.22
          dotnet restore src/Web/Web.csproj
          dotnet ef migrations bundle --self-contained --runtime linux-x64 --configuration Release --project src/Infrastructure --startup-project src/Web --output provisioning/ansible/roles/migrations/files/efbundle

      - name: Install Ansible
        uses: rishabhc32/install-ansible@v1.2.2

      - name: Install OpenTofu
        uses: cybergavin/install-opentofu@v1.0.0

      - name: Create .env file for deploy script
        run: |
          echo "${{ secrets.ENV_FILE }}" > provisioning/.env

      - name: Execute deploy script
        run: |
          cd provisioning
          chmod +x deploy.sh
          ./deploy.sh -y -e ${{ inputs.environment || 'Production' }}

      - name: Notify on failure
        if: failure()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Deploy failed"
          description: "[${{ github.repository }}] ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          color: 0xff0000
